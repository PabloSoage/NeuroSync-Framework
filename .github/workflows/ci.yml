# v2 CI pipeline.
name: ci

on:
  push:
    branches: [main, v2]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy --config-file pyproject.toml
      - run: lint-imports

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libegl1 libgl1-mesa-glx libxkbcommon-x11-0
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Run test suite (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a pytest -m "not hardware and not slow"
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Run test suite (Windows)
        if: runner.os == 'Windows'
        run: pytest -m "not hardware and not slow"
        env:
          QT_QPA_PLATFORM: offscreen
